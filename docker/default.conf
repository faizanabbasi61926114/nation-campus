# The CMS on one origin: static SPA files are served straight from disk, unknown paths fall
# through to Laravel, and only /api/* does real work. HSTS is left to the TLS terminator
# (docker/Caddyfile), which is the only place that actually knows a request is HTTPS.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/cms/backend/public;
    index index.php index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    # Hashed filenames: safe to keep for a year. `expires` is used instead of add_header
    # because a location-level add_header would otherwise discard the headers above.
    location ^~ /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The shell and the service worker must be revalidated, or a deploy leaves visitors
    # pointed at asset filenames that no longer exist.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\. {
        deny all;
    }

    location ~ ^/(?:\.env|composer\.(?:json|lock)|phpunit\.xml|artisan)$ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }
}
