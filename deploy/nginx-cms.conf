# api.school.pk — the Laravel API on nginx + PHP-FPM.
#
# Copy to /etc/nginx/sites-available/, `ln -s` it into sites-enabled, then
# `certbot --nginx -d api.school.pk` and `nginx -t && systemctl reload nginx`.
# Change the three server_name lines and the root path; nothing else is box-specific
# except the fastcgi socket, which must match `php -v`.
#
# The SPA is not served from here. On the Vercel shape (docs/vercel.md) it lives on the
# CDN and rewrites /api/* to this host; on the single-box shape, add a second server block
# whose root is frontend/dist with `try_files $uri /index.html;`.

server {
    listen 80;
    listen [::]:80;
    server_name api.school.pk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                                  # nginx < 1.25: drop this line and use `listen 443 ssl http2;`
    server_name api.school.pk;

    ssl_certificate     /etc/letsencrypt/live/api.school.pk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.school.pk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/cms/backend/public;
    index index.php;

    # No endpoint accepts uploads today. Raise this only when you add one, and expect the
    # Vercel edge to cap its side at roughly 4.5 MB regardless (docs/vercel.md section 4).
    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types application/json;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Belt and braces: with root set to public/ these are already unreachable, but a
    # mistyped root should not turn into a downloadable .env.
    location ~ /\. {
        deny all;
    }

    location ~ ^/(?:\.env|composer\.(?:json|lock)|phpunit\.xml|artisan)$ {
        deny all;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }
}

# Point an uptime monitor at /up — Laravel answers 200 with an empty body, and a 500 there
# means the app cannot read its config or reach the database.
#
# Requests arrive from Vercel's edge, whose source addresses rotate, so $request->ip()
# would otherwise record the proxy and make the Audit Log useless. On this host set
# TRUSTED_PROXIES=* only if nothing but the edge can reach it — if port 443 is also open
# to the public directly, list the proxy CIDRs instead, or a caller can spoof its own
# address in X-Forwarded-For. See backend/config/trustedproxy.php.
#
# Cron belongs here, not on Vercel, whose Hobby plan rejects anything finer than daily:
#   */15 * * * * cd /var/www/cms/backend && php artisan schedule:run >> /dev/null 2>&1
