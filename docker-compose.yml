name: cms

services:
  app:
    build: .
    image: cms-app:latest
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # MySQL is reachable only on the compose network: no published port, so the
  # database never faces the internet even if the VM security list is wrong.
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  # announcements:publish-due every fifteen minutes (backend/bootstrap/app.php).
  scheduler:
    image: cms-app:latest
    restart: unless-stopped
    env_file: .env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app

  # The only service with published ports. Caddy fetches and renews the certificate
  # itself, so there is no certbot cron to remember.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
